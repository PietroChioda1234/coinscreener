<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 320px; padding: 16px;
    background: #0f0f0f; color: #e5e5e5;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 13px;
  }

  h1 { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
  .subtitle { color: #888; font-size: 11px; margin-bottom: 16px; }

  .field { margin-bottom: 14px; }
  label {
    display: block; font-size: 11px; color: #888;
    font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 4px;
  }

  input[type="password"], input[type="text"], input[type="number"] {
    width: 100%; padding: 8px 10px; border-radius: 8px;
    border: 1px solid #333; background: #1a1a1a;
    color: #e5e5e5; font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
  }
  input:focus { outline: none; border-color: #8b5cf6; }

  .toggle-row {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 14px;
  }

  .toggle {
    width: 44px; height: 24px; border-radius: 12px;
    background: #333; border: none; cursor: pointer;
    position: relative; transition: background 0.2s;
  }
  .toggle.on { background: #16a34a; }
  .toggle::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 18px; height: 18px; border-radius: 50%;
    background: #fff; transition: transform 0.2s;
  }
  .toggle.on::after { transform: translateX(20px); }

  .save-btn {
    width: 100%; padding: 10px; border-radius: 8px;
    border: none; background: #8b5cf6; color: #fff;
    font-weight: 700; font-size: 13px; cursor: pointer;
    transition: background 0.15s;
  }
  .save-btn:hover { background: #7c3aed; }

  .status {
    margin-top: 10px; font-size: 11px; text-align: center;
    color: #16a34a; min-height: 16px;
  }

  .info {
    margin-top: 14px; padding-top: 12px;
    border-top: 1px solid #222; font-size: 11px;
    color: #666; line-height: 1.5;
  }
  .info a { color: #8b5cf6; text-decoration: none; }
</style>
</head>
<body>
  <h1>🪙 Coin Screener</h1>
  <p class="subtitle">AI-powered meme coin scanner for DexScreener</p>

  <div class="toggle-row">
    <label style="margin:0">Enabled</label>
    <button class="toggle" id="toggle"></button>
  </div>

  <div class="field">
    <label>Anthropic API Key</label>
    <input type="password" id="apiKey" placeholder="sk-ant-api03-...">
  </div>

  <div class="field">
    <label>Scan interval (seconds)</label>
    <input type="number" id="interval" min="3" max="60" value="5">
  </div>

  <button class="save-btn" id="save">Save</button>
  <div class="status" id="status"></div>

  <div class="info">
    Open <a href="https://dexscreener.com/new-pairs" target="_blank">DexScreener</a> and the extension
    will scan tokens on the page, check their Twitter/X profiles, and overlay
    AI scores. Get an API key at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a>.
  </div>

  <script src="popup.js"></script>
</body>
</html>
