<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 300px; padding: 16px;
    background: #0a0a0a; color: #e5e5e5;
    font-family: system-ui, sans-serif; font-size: 13px;
  }
  h1 { font-size: 16px; font-weight: 800; margin-bottom: 2px; }
  .sub { color: #666; font-size: 11px; margin-bottom: 16px; }

  .field { margin-bottom: 12px; }
  label { display: block; font-size: 11px; color: #888; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
  input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #e5e5e5; font-size: 13px; font-family: monospace; }
  input:focus { outline: none; border-color: #8b5cf6; }

  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .toggle { width: 42px; height: 22px; border-radius: 11px; background: #333; border: none; cursor: pointer; position: relative; transition: background .2s; }
  .toggle.on { background: #16a34a; }
  .toggle::after { content:''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .toggle.on::after { transform: translateX(20px); }

  .btn { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #8b5cf6; color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; }
  .btn:hover { background: #7c3aed; }

  .status { margin-top: 8px; font-size: 11px; text-align: center; color: #16a34a; min-height: 14px; }
  .info { margin-top: 12px; padding-top: 10px; border-top: 1px solid #1f1f1f; font-size: 11px; color: #555; line-height: 1.5; }
  .info a { color: #8b5cf6; text-decoration: none; }

  .legend { margin-top: 10px; font-size: 11px; color: #666; line-height: 1.8; }
  .legend span { font-size: 13px; }
</style>
</head>
<body>
  <h1>🪙 Coin Screener</h1>
  <p class="sub">AI meme quality scanner for GMGN & DexScreener</p>

  <div class="row">
    <label style="margin:0">Enabled</label>
    <button class="toggle" id="toggle"></button>
  </div>

  <div class="field">
    <label>Anthropic API Key</label>
    <input type="password" id="key" placeholder="sk-ant-api03-...">
  </div>

  <div class="field">
    <label>Scan interval (seconds)</label>
    <input type="number" id="interval" min="3" max="60" value="5">
  </div>

  <button class="btn" id="save">Save</button>
  <div class="status" id="status"></div>

  <div class="legend">
    <span>💎</span> Gem (70+) · <span>👀</span> Interesting (50+) · <span>😐</span> Meh (30+) · <span>👎</span> Skip · <span>🚩</span> Scam
  </div>

  <div class="info">
    Open <a href="https://gmgn.ai" target="_blank">GMGN</a> or <a href="https://dexscreener.com" target="_blank">DexScreener</a> — badges appear on tokens automatically.<br>
    Get a key at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
